name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang dependensi
        run: npm install

      - name: Salin font
        run: node scripts/copy-fonts.mjs

      - name: Buat proyek Android
        run: npx cap add android

      - name: Buat ikon dan splash screen
        run: npx capacitor-assets generate --android

      - name: Sinkronkan web ke Android
        run: npx cap sync android

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Catatan-Kantong.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Catatan-Kantong-APK
          path: Catatan-Kantong.apk

      - name: Terbitkan di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Catatan Kantong build ${{ github.run_number }}
          files: Catatan-Kantong.apk
          make_latest: true
